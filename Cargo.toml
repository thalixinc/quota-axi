[package]
name = "quota-axi"
version = "0.1.41"
edition = "2021"
description = "AXI CLI that reports local agent-provider quota windows without routing or credential minting"
license = "MIT"
repository = "https://github.com/thalixinc/quota-axi"
keywords = ["quota", "cli", "agent", "axi", "toon"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "quota-axi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde_json = "1"

[profile.release]
strip = true
lto = true
